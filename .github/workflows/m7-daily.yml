name: M7 Supplier Alpha Daily Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m7-daily.yml'
    # Trigger QQQ historical refresh after fixture migration
  workflow_dispatch:
  schedule:
    # After regular US market close: 17:30 EST / 18:30 EDT. v3.1 active 40-stock refresh.
    - cron: '30 22 * * *'
    # Morning refresh: prior completed close, source audit, and 40-stock research proxy v3.2.
    - cron: '30 13 * * *'

permissions:
  contents: write

concurrency:
  group: m7-alpha-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test score calculations and missing-data behavior
        run: python -m unittest discover -s tests -v
      - name: Refresh public market and research data
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/refresh.py
      - name: Verify outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          assert len(d.get("suppliers",[])) == 40
          assert d.get("mode") != "fixture"
          assert isinstance(d.get("audit"),dict)
          print("Prices available:",d["audit"].get("market_prices_present"))
          print("Full six-factor scores:",d["audit"].get("official_alpha_count"))
          PY
      - name: Print compact audited QQQ horizon results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/quant/latest.json")
          if not p.exists():
              print("NO_QUANT_FILE")
          else:
              q=json.loads(p.read_text())
              print("QUANT_AS_OF",q.get("as_of"),"BENCHMARK",q.get("benchmark_primary"))
              for y in ("1Y","3Y","5Y"):
                  k=f"{y} · Top 8 · 10 bps"
                  b=q.get("backtest_scenarios",{}).get(k,{})
                  print("HORIZON_RESULT",json.dumps({
                    "horizon":y,"status":b.get("status"),"start":b.get("start_date"),
                    "end":b.get("end_date"),"requested_start":b.get("requested_start"),
                    "reason":b.get("reason"),"metrics":b.get("metrics"),
                    "qqq":b.get("benchmarks",{}).get("QQQ"),
                    "xlk":b.get("benchmarks",{}).get("XLK"),
                    "trades":len(b.get("trades") or [])},ensure_ascii=False))
          PY
      - name: Print paired VIX trigger versus QQQ backtests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("data/quant/latest.json").read_text())
          if q.get("schema_version")!="1.2":raise SystemExit("VIX schema 1.2 absent; stale quant export")
          p=q.get("vix_trigger_policy") or {}
          if p.get("latest_vix_close") is None:raise SystemExit("VIX source was unavailable; cannot publish VIX trigger")
          print("VIX_POLICY",json.dumps(p,ensure_ascii=False))
          for y in ("1Y","3Y","5Y"):
              k=f"{y} · VIX Trigger · Top 8 · 10 bps"
              b=q.get("backtest_scenarios",{}).get(k,{})
              base=q.get("backtest_scenarios",{}).get(f"{y} · Top 8 · 10 bps",{})
              if b.get("status")!="COMPUTED_PRICE_ONLY_RESEARCH_DIAGNOSTIC":
                  raise SystemExit(f"{y} VIX backtest not computed: {b.get('status')} {b.get('reason')}")
              print("VIX_RESULT",json.dumps({
                "horizon":y,"status":b.get("status"),"reason":b.get("reason"),
                "start":b.get("start_date"),"end":b.get("end_date"),
                "vix_metrics":b.get("metrics"),"base_metrics":base.get("metrics"),
                "qqq_metrics":b.get("benchmarks",{}).get("QQQ"),
                "exposure":b.get("vix_trigger"),
                "vix_trade_count":len(b.get("trades") or [])},ensure_ascii=False))
          PY
      - name: Verify autonomous paper-only ledger and risk gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("data/quant/paper_state.json")
          if not path.is_file():raise SystemExit("paper state was not generated")
          a=json.loads(path.read_text())
          assert a["mode"]=="PAPER_ONLY" and a["live_enabled"] is False
          assert a["cash"]>=0 and a["equity"]>=0
          assert a["risk_limits"]["max_name_weight"]<=.15
          assert a["pending"] is None or a["pending"]["signal_day"]<=a["last_price_day"]
          assert a["pending"] is None or sum(a["pending"]["weights"].values())<=1.0000001
          assert Path("site/data/quant/paper_state.json").is_file()
          print("PAPER_ACCOUNT",json.dumps({
            "status":a["status"],"date":a["last_price_day"],"equity":a["equity"],
            "cash":a["cash"],"trade_count":a["trade_count"],
            "pending":a["pending"],"fees":a["total_fees"]},ensure_ascii=False))
          PY
      - name: Persist daily data for branch-based GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/latest.json data/snapshots/ site/data/latest.json
          if [ -d data/quant ]; then git add -A -- data/quant; fi
          if [ -d site/data/quant ]; then git add -A -- site/data/quant; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh M7 supply-chain research"
            # Concurrent documentation/Pages commits may advance main during SEC fetch.
            # Replay this data-only commit on top of the current branch before publishing.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then
                echo "Research data published"
                exit 0
              fi
              echo "Concurrent commit detected; retrying ($attempt/3)"
            done
            echo "Unable to publish daily research data after three retries" >&2
            exit 1
          fi
