name: M7 Supplier Alpha Daily Research

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 23:20 UTC is after the US closing bell all year.
    # GitHub Actions scheduled starts can be delayed.
    - cron: '20 23 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: m7-alpha-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public data, preserving missing values
        run: python scripts/refresh.py
      - name: Reject synthetic fixture exports
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/latest.json'))
          assert d.get('mode') != 'fixture'
          assert len(d.get('suppliers', [])) == 12
          PY
      - name: Commit point-in-time research snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh supply-chain research snapshot"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
