name: M7 Supplier Alpha Daily Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m7-daily.yml'
  workflow_dispatch:
  schedule:
    # After regular US market close: 17:30 EST / 18:30 EDT. v3.1 active 40-stock refresh.
    - cron: '30 22 * * *'

permissions:
  contents: write

concurrency:
  group: m7-alpha-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test score calculations and missing-data behavior
        run: python -m unittest discover -s tests -v
      - name: Refresh public market and research data
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/refresh.py
      - name: Verify outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          assert len(d.get("suppliers",[])) == 40
          assert d.get("mode") != "fixture"
          assert isinstance(d.get("audit"),dict)
          print("Prices available:",d["audit"].get("market_prices_present"))
          print("Full six-factor scores:",d["audit"].get("official_alpha_count"))
          PY
      - name: Persist daily data for branch-based GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh M7 supply-chain research"
            git push origin HEAD:main
          fi
