name: M7 Pipeline CI
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'index.html'
      - 'i18n.js'
      - 'i18n-content.js'
      - 'graph-viz.js'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Validate inline dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>",html,re.S|re.I)
          assert len(scripts)>=2, "Missing dashboard scripts"
          for i,source in enumerate(scripts):
              Path(f"/tmp/m7-inline-{i}.js").write_text(source,encoding="utf-8")
          PY
          for script in /tmp/m7-inline-*.js; do node --check "$script"; done
          node --check i18n.js
          node --check i18n-content.js
          node --check graph-viz.js
      - name: Headless browser smoke check of interactive graph
        run: |
          set -e
          BROWSER=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$BROWSER" ]; then
            echo "No headless Chrome in runner; DOM runtime check skipped, JS syntax checks remain enforced."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import shutil
          shutil.copyfile("index.html","smoke.html")
          page=Path("smoke.html").read_text(encoding="utf-8")
          script="""<script>
          document.querySelector('button[data-tab="network"]').click();
          setTimeout(()=>{
           const g=window.M7GraphViz;
           const ok=!!g && g.state.nodes.length===47 && g.state.edges.length>=20 &&
              document.getElementById('graphCanvas').width>0 &&
              !!document.getElementById('factorHeatmap').innerHTML &&
              !!document.getElementById('contribChart').innerHTML;
           document.documentElement.dataset.m7Smoke=ok?'PASS':'FAIL';
           document.documentElement.dataset.m7Nodes=g?g.state.nodes.length:'missing';
           document.documentElement.dataset.m7Edges=g?g.state.edges.length:'missing';
          },750);
          </script>"""
          page=page.replace("</body>",script+"</body>")
          Path("smoke.html").write_text(page,encoding="utf-8")
          PY
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --dump-dom "file://$PWD/smoke.html" > /tmp/m7-graph-dom.txt 2>/tmp/m7-chrome-errors.txt || {
            tail -50 /tmp/m7-chrome-errors.txt
            exit 1
          }
          python - <<'PY'
          from pathlib import Path
          import re
          d=Path("/tmp/m7-graph-dom.txt").read_text(encoding="utf-8")
          m=re.search(r'data-m7-smoke="([^"]+)"',d)
          print("Graph browser smoke:",m.group(1) if m else "not executed")
          assert m and m.group(1)=="PASS", "Graph or factor module did not render in Chromium"
          PY
      - name: Audit all five languages in a real browser
        run: python tests/check_i18n_browser.py
      - name: Run offline calculation tests
        run: python -m unittest discover -s tests -v
      - name: Verify published files and data integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert Path('index.html').is_file()
          html=Path('index.html').read_text(encoding='utf-8')
          assert Path('i18n.js').is_file()
          assert Path('i18n-content.js').is_file()
          assert 'src="i18n-content.js' in html
          assert Path('graph-viz.js').is_file()
          assert 'src="graph-viz.js' in html
          assert 'id="graphCanvas"' in html
          viz=Path('graph-viz.js').read_text(encoding='utf-8')
          assert 'setData(window.M7_LIVE_DATA' in viz
          assert all(x in viz for x in ('pointerdown','pointermove','wheel','gSearch','gLayout','gFlow'))
          html=Path('index.html').read_text(encoding='utf-8')
          translations=Path('i18n.js').read_text(encoding='utf-8')
          assert 'id="m7Language"' in html
          assert 'src="i18n.js' in html
          assert all(f"'{locale}'" in translations for locale in ('en','zh-CN','fr','es','ja'))
          assert 'localStorage.setItem' in translations
          assert Path('site/index.html').is_file()
          latest=json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          assert len(latest.get('suppliers',[]))==40
          assert all(x.get('ticker') for x in latest['suppliers'])
          assert isinstance(latest.get('audit'),dict)
          print('Verified 40-ticker research snapshot and static dashboard.')
          PY
