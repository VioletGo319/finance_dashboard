name: M7 Pipeline CI
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'index.html'
      - 'i18n.js'
      - 'graph-viz.js'
      - 'config/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Validate inline dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>",html,re.S|re.I)
          assert len(scripts)>=2, "Missing dashboard scripts"
          for i,source in enumerate(scripts):
              Path(f"/tmp/m7-inline-{i}.js").write_text(source,encoding="utf-8")
          PY
          for script in /tmp/m7-inline-*.js; do node --check "$script"; done
          node --check i18n.js
          node --check graph-viz.js
      - name: Run offline calculation tests
        run: python -m unittest discover -s tests -v
      - name: Verify published files and data integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert Path('index.html').is_file()
          assert Path('i18n.js').is_file()
          assert Path('graph-viz.js').is_file()
          assert 'src="graph-viz.js"' in html
          assert 'id="graphCanvas"' in html
          viz=Path('graph-viz.js').read_text(encoding='utf-8')
          assert 'setData(window.M7_LIVE_DATA' in viz
          assert all(x in viz for x in ('pointerdown','pointermove','wheel','gSearch','gLayout','gFlow'))
          html=Path('index.html').read_text(encoding='utf-8')
          translations=Path('i18n.js').read_text(encoding='utf-8')
          assert 'id="m7Language"' in html
          assert 'src="i18n.js"' in html
          assert all(f"'{locale}'" in translations for locale in ('en','zh-CN','fr','es','ja'))
          assert 'localStorage.setItem' in translations
          assert Path('site/index.html').is_file()
          latest=json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          assert len(latest.get('suppliers',[]))==40
          assert all(x.get('ticker') for x in latest['suppliers'])
          assert isinstance(latest.get('audit'),dict)
          print('Verified 40-ticker research snapshot and static dashboard.')
          PY
